<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMood - Movie Library</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-film"></i> Cine<span>Mood</span>
        </div>
        <nav>
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
            <a href="movies.html" class="nav-link active"><i class="fa-solid fa-clapperboard"></i> Movies</a>
            <a href="watchlist.html" class="nav-link"><i class="fa-solid fa-bookmark"></i> Watchlist (<span id="watchlist-count">0</span>)</a>
        </nav>
    </header>

    <!-- Filter Section -->
    <section class="filter-section">
        <div class="filter-container">
            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="search-input" placeholder="Search for a movie...">
            </div>
            
            <div class="filter-options">
                <select id="mood-filter">
                    <option value="all">All Moods</option>
                    <option value="happy">😄 Happy</option>
                    <option value="sad">😢 Sad</option>
                    <option value="action">🔥 Action</option>
                    <option value="romantic">❤️ Romantic</option>
                    <option value="chill">☕ Chill</option>
                </select>
            </div>
        </div>
    </section>

    <!-- Movies Grid -->
    <main class="main-container">
        <h2 class="section-title">All Available Movies</h2>
        <div class="movies-grid" id="movies-container"></div>
    </main>

    <!-- Trailer Modal -->
    <div id="trailer-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <div class="video-container">
                <iframe id="trailer-iframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>CineMood &copy; 2026 - All rights reserved</p>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
