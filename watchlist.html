<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CineMood - Watchlist</title>
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Navbar -->
    <header class="navbar">
        <div class="logo">
            <i class="fa-solid fa-film"></i> Cine<span>Mood</span>
        </div>
        <nav>
            <a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Home</a>
            <a href="movies.html" class="nav-link"><i class="fa-solid fa-clapperboard"></i> Movies</a>
            <a href="watchlist.html" class="nav-link active"><i class="fa-solid fa-bookmark"></i> Watchlist (<span id="watchlist-count">0</span>)</a>
        </nav>
    </header>

    <!-- Watchlist Main -->
    <main class="main-container">
        <div class="watchlist-header">
            <h2 class="section-title">Saved Movies for Later 📌</h2>
            <button id="clear-all-btn" class="btn-clear-all">
                <i class="fa-solid fa-trash-can"></i> Clear All
            </button>
        </div>

        <!-- Empty State -->
        <div id="empty-state" class="empty-state">
            <i class="fa-solid fa-popcorn"></i>
            <h3>Your watchlist is empty!</h3>
            <p>Browse movies and click "Add to Watchlist" to plan your movie night.</p>
            <a href="movies.html" class="btn-explore">Explore Movies Now</a>
        </div>

        <!-- Movies Grid -->
        <div class="movies-grid" id="watchlist-container"></div>
    </main>

    <!-- Trailer Modal -->
    <div id="trailer-modal" class="modal">
        <div class="modal-content">
            <span class="close-btn" id="close-modal">&times;</span>
            <div class="video-container">
                <iframe id="trailer-iframe" src="" frameborder="0" allowfullscreen></iframe>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer>
        <p>CineMood &copy; 2026 - All rights reserved</p>
    </footer>

    <!-- Scripts -->
    <script src="script.js"></script>
</body>
</html>
